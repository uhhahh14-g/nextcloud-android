name: App-server 210 installation verification
on:
  push:
    branches: [appserver210-verification]
permissions:
  contents: read
  actions: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch signed APK from matching build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            state=$(gh api repos/${{ github.repository }}/actions/runs/42697851352 --jq '.status')
            if [ "$state" = completed ]; then break; fi
            sleep 20
          done
          result=$(gh api repos/${{ github.repository }}/actions/runs/42697851352 --jq '.conclusion')
          test "$result" = success
          gh run download 42697851352 --repo "${{ github.repository }}" -n Nextcloud-210-APK -D dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch signed APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/appserver210-smoke.py
      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Appserver210-installation-evidence
          path: smoke-results/
          if-no-files-found: ignore
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Install build SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;4.1.2"
      - name: Source quality checks
        run: |
          chmod +x gradlew
          ./gradlew :app:spotlessKotlinCheck :app:lintGenericRelease :app:spotbugsGenericRelease :app:detekt --continue --stacktrace
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Appserver210-quality-reports
          path: app/build/reports/
          if-no-files-found: ignore
